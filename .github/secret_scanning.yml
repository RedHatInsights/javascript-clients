# GitHub Secret Scanning Exclusions
# Documentation: https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/exclude-folders-and-files
#
# Configured to optimize pull request scan performance in this Nx monorepo by
# excluding large machine-generated files, lockfiles, and generated docs that
# contain no credentials but significantly increase scan duration and false positives.
#
# Hand-written source packages (@redhat-cloud-services/build-utils and
# @redhat-cloud-services/javascript-clients-shared), custom generator templates,
# CI workflows, and application code remain strictly scanned.

paths-ignore:
  # ---------------------------------------------------------------------------
  # Dependency Lockfiles
  # Machine-generated npm lockfile (~750KB, 26,000+ lines). Contains dependency
  # integrity hashes (sha512), URLs, and metadata. Modified frequently by Renovate
  # and dependency PRs, causing heavy regex scanning bottlenecks.
  # ---------------------------------------------------------------------------
  - "package-lock.json"
  - "**/package-lock.json"

  # ---------------------------------------------------------------------------
  # Documentation & Generated TypeDoc Reference
  # Markdown documentation, architectural guides, and auto-generated API reference
  # markdown files (>28,000 lines across packages) which never contain credentials.
  # ---------------------------------------------------------------------------
  - "docs/**"
  - "packages/**/doc/**"

  # ---------------------------------------------------------------------------
  # OpenAPI Generator Metadata & Cache
  # Generator tracking and manifest files (FILES, VERSION) produced during codegen.
  # ---------------------------------------------------------------------------
  - ".openapi-generator/**"
  - "**/.openapi-generator/**"
  - "**/.openapi-generator-ignore"

  # ---------------------------------------------------------------------------
  # Test Fixtures & Mocks
  # Static mock payloads and fixtures used for Cypress E2E testing.
  # ---------------------------------------------------------------------------
  - "apps/test-app-e2e/src/fixtures/**"

  # ---------------------------------------------------------------------------
  # Build Outputs, Distribution Artifacts & Coverage
  # Compiled bundles and coverage reports (dist, coverage, tmp).
  # ---------------------------------------------------------------------------
  - "dist/**"
  - "packages/**/dist/**"
  - "coverage/**"
  - "tmp/**"

  # ---------------------------------------------------------------------------
  # Auto-Generated Client Code (HCC Service Clients)
  # Wiped and regenerated from public OpenAPI specifications via `npm run generate`.
  # These account for >88,000 lines of generated TypeScript models and wrappers.
  #
  # NOTE: Hand-written packages (@redhat-cloud-services/javascript-clients-shared
  # and @redhat-cloud-services/build-utils) are intentionally NOT excluded here,
  # preserving full secret detection on authentication interceptors and build logic.
  #
  # The block between the markers below is maintained automatically by each
  # client's `configure-secret-scanning` Nx target (a dependency of
  # `generate`; see utils/add-secret-scanning-exclusion.js), which appends a
  # new "packages/<name>/src/**" entry the first time that client's code is
  # generated. Do not hand-edit entries in this block; removing a retired
  # package is the only manual change that should happen here.
  # ---------------------------------------------------------------------------
  # AUTO-GENERATED-CLIENT-EXCLUSIONS:START
  - "packages/compliance/src/**"
  - "packages/config-manager/src/**"
  - "packages/entitlements/src/**"
  - "packages/host-inventory/src/**"
  - "packages/insights/src/**"
  - "packages/integrations/src/**"
  - "packages/notifications/src/**"
  - "packages/patch/src/**"
  - "packages/quickstarts/src/**"
  - "packages/rbac/src/**"
  - "packages/remediations/src/**"
  - "packages/rhsm-subscriptions-utilization/src/**"
  - "packages/scheduler/src/**"
  - "packages/sources/src/**"
  - "packages/topological-inventory/src/**"
  # AUTO-GENERATED-CLIENT-EXCLUSIONS:END

  # ---------------------------------------------------------------------------
  # Legacy / Special-Cased Client Exclusions
  # These packages predate the `src/` scaffolding convention (or split their
  # generated output across additional files/directories), so they are kept
  # outside the auto-managed block above and require manual maintenance.
  # ---------------------------------------------------------------------------
  - "packages/sources/configuration.ts"
  - "packages/vulnerabilities/src/**"
  - "packages/vulnerabilities/git-api/**"
  - "packages/vulnerabilities/api.ts"
  - "packages/vulnerabilities/base.ts"
  - "packages/vulnerabilities/configuration.ts"
  - "packages/vulnerabilities/apiSpec.json"
