name: Lint project
description: verify linting rules
runs:
  using: "composite"
  steps:
    - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5
    - name: Install deps
      shell: bash
      run: npm ci
    - name: Lint affected
      shell: bash
      run: npx nx affected -t lint --exclude=@redhat-cloud-services/CLIENTNAME-client
