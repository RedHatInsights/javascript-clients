name: Unit tests
description: verify unit tests
runs:
  using: "composite"
  steps:
    - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5
    - name: Install deps
      shell: bash
      run: npm ci
    - name: Test affected
      shell: bash
      run: npx nx affected -t test --configuration=ci --exclude=@redhat-cloud-services/CLIENTNAME-client
