name: Setup Environment
description: Setup Node.js and cache dependencies consistently
# Note: All workflows using this action should use runs-on: ubuntu-24.04
runs:
  using: "composite"
  steps:
    - name: Show environment info
      shell: bash
      run: |
        echo "=== Pre-installed Node.js versions ==="
        ls -la /opt/hostedtoolcache/node/ 2>/dev/null || ls -la /opt/acttoolcache/node/ 2>/dev/null || echo "No pre-installed Node versions found"
        echo "=== Current default Node.js ==="
        which node && node --version || echo "No default Node.js found"
        echo "=== .nvmrc content ==="
        cat .nvmrc 2>/dev/null || echo "No .nvmrc file found"
        echo "=== .java-version content ==="
        cat .java-version 2>/dev/null || echo "No .java-version file found"
        echo "=== Current Java ==="
        which java && java --version || echo "No default Java found"
    - name: Setup Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: 'temurin'
        java-version-file: '.java-version'
        cache: 'maven'
    # Use the latest Node/npm development-toolchain pins from .nvmrc and
    # package.json. The package.json engine minimums remain compatible with
    # MintMaker's Renovate image: quay.io/konflux-ci/mintmaker-renovate-image.
    # See README.md#node-and-npm-toolchain for details.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
    - name: Enable Corepack and activate pinned npm version
      shell: bash
      run: |
        corepack enable npm
        corepack install
    - name: Show final versions
      shell: bash
      run: |
        echo "=== Final Java version after setup ==="
        which java && java --version
        which mvn && mvn --version || echo "Maven not found"
        echo "=== Final Node.js version after setup ==="
        which node && node --version
        npm --version
    - uses: './.github/actions/node-cache'
